name: Validate, test and deploy monthly catalog
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Activate an already submitted catalog on the first day, after midnight NY year-round.
    - cron: '17 5 1 * *'
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: monthly-catalog
          path: public/data/events.json
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: monthly-catalog
          path: expected
      - name: Reject superseded publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/serhii-moskalenko/family-events/git/ref/heads/main --jq '.object.sha')
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo 'A newer commit exists; refusing to deploy this older catalog.'
            exit 1
          fi
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact live catalog
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in $(seq 1 12); do
            if curl --max-time 20 --fail --silent --show-error "${PAGE_URL}data/events.json?revision=${GITHUB_SHA}&attempt=${attempt}" -o /tmp/catalog.json && cmp expected/events.json /tmp/catalog.json; then
              exit 0
            fi
            sleep 10
          done
          echo 'Live catalog did not match deployed artifact'
          exit 1

  save-catalog:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, deploy]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: monthly-catalog
          path: ${{ runner.temp }}/verified-catalog
      - name: Save only the successfully tested and deployed catalog
        env:
          CATALOG_ARTIFACT: ${{ runner.temp }}/verified-catalog
        run: |
          remote_head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo 'Main changed; leaving the newer checkout untouched.'
            exit 0
          fi
          cp "$CATALOG_ARTIFACT/events.json" public/data/events.json
          git add public/data/events.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Save published monthly catalog [skip ci]'
          git push origin HEAD:main

name: Validate weekly catalog and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Research and Monday scheduling belong to the user's local ChatGPT task.
# No scheduled discovery or paid AI calls run in Actions.
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      catalog_hash: ${{ steps.catalog.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate submission and stage candidate atomically
        run: npm run catalog:ingest -- incoming/weekly-catalog.json
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - name: Record exact artifact hash
        id: catalog
        run: echo "hash=$(sha256sum public/data/events.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Retain validated catalog
        uses: actions/upload-artifact@v4
        with:
          name: verified-catalog
          path: public/data/events.json
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject superseded builds before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/serhii-moskalenko/family-events/git/ref/heads/main --jq '.object.sha')
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo 'A newer submission exists. This run will not publish an older catalog.'
            exit 1
          fi
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live application and exact catalog
        env:
          EXPECTED_HASH: ${{ needs.build.outputs.catalog_hash }}
        run: node scripts/verify-live.mjs "$EXPECTED_HASH"
  save-catalog:
    if: github.event_name != 'pull_request'
    needs: [build, deploy]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-catalog
          path: ${{ runner.temp }}/verified-catalog
      - name: Save only the successfully tested and deployed catalog
        env:
          CATALOG_ARTIFACT: ${{ runner.temp }}/verified-catalog
        run: |
          remote_head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo 'Main changed; leaving the newer checkout untouched.'
            exit 0
          fi
          cp "$CATALOG_ARTIFACT/events.json" public/data/events.json
          git add public/data/events.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Save published weekly catalog [skip ci]'
          git push origin HEAD:main
